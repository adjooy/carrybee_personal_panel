<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parcel Panel</title>
<style>
:root{--accent:#2563eb;--green:#15803d;--muted:#64748b;--border:#e2e8f0;--text:#172033;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.page-content{max-width:1400px;margin:auto;padding:26px 20px}.page-head,.top-actions,.toolbar,.toolbar-actions,.da-head,.upload-zone,.upload-left{display:flex;align-items:center;gap:14px}.page-head,.toolbar,.da-head,.upload-zone{justify-content:space-between}.page-head{margin-bottom:22px}.page-title{font-size:26px;margin:0 0 5px}.page-sub{margin:0;color:var(--muted);font-size:13px}.card{background:white;border:1px solid var(--border);border-radius:15px;box-shadow:0 3px 15px #12203b08}.btn{border:0;border-radius:9px;padding:10px 15px;cursor:pointer;font-weight:700;font-size:12px;white-space:nowrap}.btn-primary{background:var(--accent);color:white}.btn-light{background:white;border:1px solid var(--border);color:var(--text)}.btn-danger{background:#fee2e2;color:#b91c1c}.btn:hover{filter:brightness(.96)}.upload-card{padding:22px;margin-bottom:20px}.upload-zone{border:1.5px dashed #c8d0dc;border-radius:14px;padding:30px;transition:.2s}.upload-zone.drag{border-color:var(--accent);background:#eff6ff}.upload-icon{width:48px;height:48px;border-radius:13px;background:#eff6ff;color:var(--accent);display:grid;place-items:center;font-size:23px}.upload-title{font-size:14px;font-weight:750}.upload-file{font-family:var(--mono);color:var(--accent);font-size:11px;margin-top:4px;overflow-wrap:anywhere}input[type=file]{display:none}.status{display:none;margin:0 0 18px;padding:12px 14px;border-radius:10px;background:#fff1f2;border:1px solid #fecdd3;color:#b91c1c;font-size:12px}.summary{display:none;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:20px}.sum-card{padding:17px;position:relative;overflow:hidden}.sum-card:after{content:"";position:absolute;right:-25px;top:-25px;width:80px;height:80px;border-radius:50%;background:var(--cat);opacity:.06}.sum-number{font-family:var(--mono);font-size:25px;font-weight:800}.sum-label{color:var(--muted);font-size:10px;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}.toolbar{display:none;margin-bottom:13px;flex-wrap:wrap;gap:10px}.toolbar-info{font-size:12px;color:var(--muted)}.toolbar-actions{flex-wrap:wrap;gap:8px}.da-card{margin-bottom:18px;overflow:hidden}.da-head{padding:15px 17px;border-bottom:1px solid var(--border)}.da-name{font-size:14px;font-weight:800;overflow-wrap:anywhere}.da-meta{color:var(--muted);font-family:var(--mono);font-size:10px;margin-top:4px}.copy-btn{background:white;border:1px solid var(--border);padding:8px 12px;border-radius:9px;font-size:11px;font-weight:700;cursor:pointer}.copy-btn:hover{background:#111827;color:white}.copy-btn.copied{background:var(--green);border-color:var(--green);color:white}.table-wrap{overflow-x:auto}table.grid{width:100%;border-collapse:collapse;font-size:11.5px}.grid th,.grid td{border:1px solid var(--border);padding:7px 9px;text-align:left;white-space:nowrap}.grid thead .labels th{color:white;font-size:10px;text-transform:uppercase;letter-spacing:.3px}.c0{background:#0f766e}.c1{background:#15803d}.c2{background:#b45309}.c3{background:#dc2626}.c4{background:#7c3aed}.grid .counts td{text-align:center;font-family:var(--mono);font-weight:800;background:#f8fafc}.grid tbody td{font-family:var(--mono);font-size:11px}.grid tbody tr:nth-child(even){background:#fafafa}.empty{padding:45px 20px;text-align:center;color:var(--muted)}@media(max-width:900px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.page-content{padding:16px 10px}.page-title{font-size:22px}.upload-card{padding:12px}.upload-zone{flex-direction:column;align-items:stretch;padding:18px}.upload-zone .btn{text-align:center}.summary{gap:8px}.sum-card{padding:13px}.sum-number{font-size:22px}.da-head{padding:12px}.grid th,.grid td{padding:7px 8px}.toolbar{align-items:flex-start}}
</style>
</head>
<body><div class="page-content">
<div class="page-head"><div><h1 class="page-title">Parcel Panel</h1><p class="page-sub">DA-wise parcel breakdown</p></div><div class="top-actions"><button class="btn btn-danger" id="resetBtn" style="display:none">Reset</button></div></div>
<div class="card upload-card"><div class="upload-zone" id="dropzone"><div class="upload-left"><div class="upload-icon">⇪</div><div><div class="upload-title">Select Consignment CSV</div><div class="upload-file" id="fname">No file selected</div></div></div><label class="btn btn-primary" for="fileInput">Choose CSV</label><input type="file" id="fileInput" accept=".csv,text/csv"></div></div>
<div class="status" id="status"></div><div class="summary" id="summary"></div><div class="toolbar" id="toolbar"><div class="toolbar-info" id="daCount"></div><div class="toolbar-actions"><button class="btn btn-light" id="copyAllBtn">Copy All</button></div></div><div id="cards"></div><div class="card empty" id="emptyState">Select a CSV file to view the parcel breakdown.</div>
</div><script>
'use strict';
const CATS=[{key:'assigned',label:'Assigned Parcel',cls:'c0'},{key:'delivered',label:'Delivered Parcel',cls:'c1'},{key:'hold',label:'Hold Parcel',cls:'c2'},{key:'rto',label:'RTO Parcel',cls:'c3'},{key:'exchange',label:'Exchange / Partial / Paid Return',cls:'c4'}];
const CAT_COLOR={assigned:'#0f766e',delivered:'#15803d',hold:'#b45309',rto:'#dc2626',exchange:'#7c3aed'};
let rawRows=[],statusRules={};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseCSV(text){
 text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],field='',quoted=false;
 for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"'&&field==='')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(v=>v.trim()))rows.push(row);row=[];field=''}else field+=c}
 if(quoted)throw Error('Unclosed quoted field in CSV');row.push(field);if(row.some(v=>v.trim()))rows.push(row);
 if(!rows.length)return [];const headers=rows.shift().map(v=>v.trim());return rows.map(values=>Object.fromEntries(headers.map((h,i)=>[h,(values[i]??'').trim()])));
}
function showError(message){$('status').textContent=message;$('status').style.display='block'}
async function handleFile(file){if(!file)return;$('status').style.display='none';$('fname').textContent=file.name;try{const rows=parseCSV(await file.text()).filter(r=>r['Consignment Id']?.trim());if(!rows.length){showError('No valid parcel data found. Required column: Consignment Id.');return}rawRows=rows;buildMapping();$('resetBtn').style.display='inline-block';render()}catch(err){showError('CSV error: '+err.message)}}
$('fileInput').addEventListener('change',e=>handleFile(e.target.files[0]));
['dragover','dragenter'].forEach(ev=>$('dropzone').addEventListener(ev,e=>{e.preventDefault();$('dropzone').classList.add('drag')}));
['dragleave','drop'].forEach(ev=>$('dropzone').addEventListener(ev,e=>{e.preventDefault();$('dropzone').classList.remove('drag')}));
$('dropzone').addEventListener('drop',e=>handleFile(e.dataTransfer.files[0]));
$('resetBtn').addEventListener('click',()=>{rawRows=[];statusRules={};$('fileInput').value='';$('fname').textContent='No file selected';$('cards').innerHTML='';$('summary').innerHTML='';$('summary').style.display='none';$('toolbar').style.display='none';$('status').style.display='none';$('emptyState').style.display='block';$('resetBtn').style.display='none'});
function guessRule(status){const s=(status||'').toLowerCase().trim();const r={delivered:false,hold:false,rto:false,exchange:false};if(!s)return r;if(s==='delivered'){r.delivered=true;return r}if(s.includes('hold')){r.hold=true;return r}if(s==='paid_return'||s==='paidreturn'||s.includes('exchange')||s.includes('partial')){r.delivered=true;r.exchange=true;return r}if(s.includes('rto')||s.includes('return_to')||s.includes('undeliver')||(s.includes('return')&&!s.includes('paid'))){r.rto=true;return r}return r}
function buildMapping(){statusRules={};for(const r of rawRows){const s=(r['Order Status']||'').trim();if(s&&!statusRules[s])statusRules[s]=guessRule(s)}}
const normName=s=>(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const rowPriority=r=>r.delivered?0:r.hold?1:r.rto?2:3;
function groupByDA(){const groups=new Map();rawRows.forEach(r=>{const rawName=(r['DA Name']||'').trim()||'Unassigned',emp=(r['DA Employee Id']||'').trim(),phone=(r['DA Phone']||'').trim(),key=normName(rawName);if(!groups.has(key))groups.set(key,{name:rawName,emps:new Set(),phones:new Set(),rows:[]});const g=groups.get(key);if(emp)g.emps.add(emp);if(phone)g.phones.add(phone);const status=(r['Order Status']||'').trim();g.rows.push({cid:r['Consignment Id'].trim(),...statusRules[status]||guessRule(status)})});return [...groups.values()].map(g=>({...g,emp:[...g.emps].join(', '),phone:[...g.phones].join(', '),rows:g.rows.sort((a,b)=>rowPriority(a)-rowPriority(b))})).sort((a,b)=>a.name.localeCompare(b.name))}
function daCols(da){return {assigned:da.rows.map(r=>r.cid),delivered:da.rows.map(r=>r.delivered?r.cid:''),hold:da.rows.map(r=>r.hold?r.cid:''),rto:da.rows.map(r=>r.rto?r.cid:''),exchange:da.rows.map(r=>r.exchange?r.cid:'')}}
function daCounts(da){const cols=daCols(da),counts={};CATS.forEach(c=>counts[c.key]=cols[c.key].filter(Boolean).length);return counts}
function daBlockToTSV(da){const cols=daCols(da);return da.rows.map((_,i)=>CATS.map(c=>cols[c.key][i]||'').join('\t')).join('\n')}
async function copyText(value,btn){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(value);else{const t=document.createElement('textarea');t.value=value;t.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('Copy unavailable')}const original=btn.textContent;btn.textContent='Copied!';btn.classList.add('copied');setTimeout(()=>{btn.textContent=original;btn.classList.remove('copied')},1600)}catch(err){showError('Could not copy automatically. Try opening the file in Chrome or Edge.')}}
function render(){const groups=groupByDA();if(!groups.length)return;$('emptyState').style.display='none';$('summary').style.display='grid';$('toolbar').style.display='flex';const totals=Object.fromEntries(CATS.map(c=>[c.key,0]));groups.forEach(g=>{const counts=daCounts(g);CATS.forEach(c=>totals[c.key]+=counts[c.key])});$('summary').innerHTML=CATS.map(c=>`<div class="card sum-card" style="--cat:${CAT_COLOR[c.key]}"><div class="sum-number">${totals[c.key]}</div><div class="sum-label">${c.label}</div></div>`).join('');$('daCount').textContent=`${groups.length} DA · ${rawRows.length} parcels`;$('cards').innerHTML='';groups.forEach(da=>{const cols=daCols(da),counts=daCounts(da),card=document.createElement('div');card.className='card da-card';const rowsHtml=da.rows.map((_,i)=>`<tr>${CATS.map(c=>`<td>${esc(cols[c.key][i]||'')}</td>`).join('')}</tr>`).join('');card.innerHTML=`<div class="da-head"><div><div class="da-name">${esc(da.name)}</div><div class="da-meta">${esc(da.emp)}${da.phone?' · '+esc(da.phone):''}</div></div><button class="copy-btn">Copy</button></div><div class="table-wrap"><table class="grid"><thead><tr class="labels">${CATS.map(c=>`<th class="${c.cls}">${esc(c.label)}</th>`).join('')}</tr><tr class="counts">${CATS.map(c=>`<td>${counts[c.key]}</td>`).join('')}</tr></thead><tbody>${rowsHtml}</tbody></table></div>`;card.querySelector('.copy-btn').addEventListener('click',function(){copyText(daBlockToTSV(da),this)});$('cards').appendChild(card)});$('copyAllBtn').onclick=function(){copyText(groups.map(da=>`# ${da.name}\n`+daBlockToTSV(da)).join('\n\n'),this)}}
</script></body></html>
